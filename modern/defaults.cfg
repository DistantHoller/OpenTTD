soundsset = Modern Temperate
videodriver = cocoa-metal
sounddriver = cocoa:hz=48000
blitter = 32bpp-anim
resolution = 1280, 800
fullscreen = false
small_font = HelveticaNeue
medium_font = HelveticaNeue
large_font = HelveticaNeue
mono_font = Menlo
small_size = 11
medium_size = 13
large_size = 22
mono_size = 12
small_aa = true
medium_aa = true
large_aa = true
mono_aa = true
gui_scale = 200
allow_hidpi = true
